<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Хронология · Русская Рамаяна</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cormorant+SC:wght@300;400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1410;
    --ink-soft: #3d3428;
    --ink-muted: #7a6e62;
    --paper: #f5f0e8;
    --paper-dark: #ede6d6;
    --gold: #b8913a;
    --gold-light: #d4a84b;
    --gold-pale: #f0e0b0;
    --border: rgba(184,145,58,0.25);
    --border-strong: rgba(184,145,58,0.5);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    line-height: 1.7;
    min-height: 100vh;
  }

  /* Paper texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      repeating-linear-gradient(
        0deg,
        transparent, transparent 28px,
        rgba(184,145,58,0.03) 28px, rgba(184,145,58,0.03) 29px
      );
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 800px;
    margin: 0 auto;
    padding: 60px 2rem 100px;
    position: relative;
    z-index: 1;
  }

  header {
    text-align: center;
    margin-bottom: 80px;
  }

  .header-ornament {
    display: block;
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    letter-spacing: 0.35em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  h1 {
    font-family: 'Cormorant SC', serif;
    font-size: clamp(2.2rem, 5vw, 3.8rem);
    font-weight: 300;
    letter-spacing: 0.05em;
    line-height: 1.1;
    margin-bottom: 24px;
  }

  .nav-back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: var(--gold);
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    font-style: italic;
    border-bottom: 1px solid var(--border);
    transition: color 0.2s, border-color 0.2s;
    margin-bottom: 40px;
  }
  .nav-back:hover { color: var(--gold-light); border-color: var(--gold-light); }

  /* ── TIMELINE ── */
  .timeline {
    position: relative;
    padding: 40px 0;
  }

  .timeline::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 1px;
    background: var(--border-strong);
    transform: translateX(-50%);
  }

  .timeline-item {
    margin-bottom: 60px;
    position: relative;
    width: 50%;
    padding: 0 40px;
  }

  .timeline-item:nth-child(odd) {
    left: 0;
    text-align: right;
  }

  .timeline-item:nth-child(even) {
    left: 50%;
    text-align: left;
  }

  .timeline-dot {
    position: absolute;
    top: 0;
    width: 12px;
    height: 12px;
    background: var(--gold);
    border: 2px solid var(--paper);
    transform: rotate(45deg);
    z-index: 2;
  }

  .timeline-item:nth-child(odd) .timeline-dot { right: -6px; }
  .timeline-item:nth-child(even) .timeline-dot { left: -6px; }

  .year-label {
    font-family: 'Cormorant SC', serif;
    font-size: 24px;
    color: var(--gold);
    margin-bottom: 8px;
    display: block;
  }

  .event-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 12px;
    color: var(--ink);
  }

  .event-desc {
    font-size: 14px;
    color: var(--ink-soft);
    background: var(--paper-dark);
    padding: 20px;
    border: 1px solid var(--border);
  }

  @media (max-width: 600px) {
    .timeline::before { left: 20px; }
    .timeline-item {
      width: 100%;
      left: 0 !important;
      padding-left: 50px;
      padding-right: 0;
      text-align: left !important;
    }
    .timeline-dot { left: 14px !important; }
  }

  footer {
    text-align: center;
    margin-top: 80px;
    padding-top: 40px;
    border-top: 1px solid var(--border);
  }

  footer p {
    font-size: 13px;
    color: var(--ink-muted);
    font-style: italic;
  }
</style>
</head>
<body>

<div class="container">
  <a href="index.html" class="nav-back">← Вернуться на главную</a>

  <header>
    <span class="header-ornament">История во времени</span>
    <h1>Хронология русской Рамаяны</h1>
    <p style="font-family: 'Cormorant Garamond', serif; font-style: italic; color: var(--ink-muted); font-size: 18px;">
      От первых переводов до современного цифрового корпуса.
    </p>
  </header>

  <div class="timeline" id="timeline-container">
    <!-- Will be populated from JSON -->
  </div>

  <footer>
    <p>Данные обновляются по мере продвижения проекта.</p>
  </footer>
</div>

<script>
async function loadTimeline() {
  try {
    const res = await fetch('data/timeline.json');
    const data = await res.json();
    const container = document.getElementById('timeline-container');
    
    data.forEach(item => {
      const div = document.createElement('div');
      div.className = 'timeline-item';
      div.innerHTML = `
        <div class="timeline-dot"></div>
        <span class="year-label">${item.year}</span>
        <h3 class="event-title">${item.event}</h3>
        <div class="event-desc">${item.description}</div>
      `;
      container.appendChild(div);
    });
  } catch (e) {
    console.error('Error loading timeline:', e);
  }
}

window.addEventListener('DOMContentLoaded', loadTimeline);
</script>

</body>
</html>
