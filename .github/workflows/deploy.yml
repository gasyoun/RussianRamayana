name: Deploy to Pages

# Pre-renders the data-driven pages to static HTML (scripts/prerender.py) and
# deploys the baked site to GitHub Pages. Source of truth stays on main as
# templates + JSON; this workflow bakes content for SEO / archivability.

on:
  push:
    branches: [main]
    # Skip the (slow) prerender+deploy for changes that don't affect the site.
    paths-ignore:
      - '.ai_state.md'
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'CLAUDE.md'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Pre-render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Pre-render pages
        run: python scripts/prerender.py
      - name: Sanity-check baked output
        run: |
          test -s dist/index.html
          grep -q 'translation-card' dist/translations.html
          grep -q 'kanda' dist/kandas.html
          echo "baked content present"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
