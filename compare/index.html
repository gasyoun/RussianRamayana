<style>
  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 60px 2rem 100px;
    position: relative;
    z-index: 1;
  }

  header {
    text-align: center;
    margin-bottom: 60px;
  }

  h1 {
    font-family: 'Cormorant SC', serif;
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 300;
    letter-spacing: 0.05em;
    line-height: 1.1;
    margin-bottom: 16px;
  }

  .subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    font-style: italic;
    color: var(--ink-muted);
  }

  /* ── EPISODE GRID ── */
  .episode-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
  }

  .episode-card {
    background: var(--paper-dark);
    border: 1px solid var(--border);
    padding: 28px;
    transition: transform 0.3s, border-color 0.3s;
    display: flex;
    flex-direction: column;
  }

  .episode-card.ready {
    cursor: pointer;
    text-decoration: none;
    color: inherit;
  }
  .episode-card.ready:hover {
    transform: translateY(-3px);
    border-color: var(--gold);
  }

  .episode-card.pending {
    opacity: 0.65;
  }

  .episode-top {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 12px;
  }

  .episode-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    color: var(--gold);
    font-style: italic;
    min-width: 22px;
  }

  .episode-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    color: var(--ink);
    flex: 1;
  }

  .episode-badge {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 3px 10px;
    border: 1px solid;
    white-space: nowrap;
  }

  .badge-ready {
    color: var(--success);
    border-color: rgba(74,103,65,0.3);
  }

  .badge-pending {
    color: var(--gold);
    border-color: var(--border-strong);
  }

  .episode-desc {
    font-size: 13px;
    color: var(--ink-muted);
    line-height: 1.6;
    flex: 1;
  }

  .episode-arrow {
    display: inline-block;
    margin-top: 12px;
    font-family: 'Cormorant SC', serif;
    font-size: 12px;
    color: var(--gold);
    letter-spacing: 0.08em;
  }

  footer {
    margin-top: 60px;
    text-align: center;
    font-size: 12px;
    color: var(--ink-muted);
  }

  @media (max-width: 700px) {
    .episode-grid {
      grid-template-columns: 1fr;
    }
  }
</style>

<body>
<noscript><div style="max-width:680px;margin:40px auto;padding:2rem;background:var(--paper-dark);border:1px solid var(--border);text-align:center;font-size:14px;color:var(--ink-muted);">Для работы этой страницы требуется JavaScript. Пожалуйста, включите его в настройках браузера.</div></noscript>

<div class="container">
  <a href="../index.html" class="nav-back">← Вернуться на главную</a>

  <header>
    <span class="header-ornament">Параллельные тексты</span>
    <h1>Сравнительное чтение</h1>
    <p class="subtitle">Как звучит Рамаяна? Сравните санскрит, подстрочник и поэтический перевод в ключевых эпизодах.</p>
  </header>

  <div class="episode-grid" id="episode-grid">
    <!-- Populated from comparison-episodes.json -->
  </div>

  <footer>
    <p>Тексты подготовлены на основе материалов <a href="https://samskrtam.ru" target="_blank" rel="noopener noreferrer" style="color: var(--gold); text-decoration: none; border-bottom: 1px solid var(--border-strong);">samskrtam.ru</a>.</p>
  </footer>
</div>

<script src="../js/utils.js"></script>
<script>
const roman = ['','I','II','III','IV','V','VI','VII','VIII'];

async function loadEpisodes() {
  const data = await loadJSON('../data/comparison-episodes.json', 'episode-grid');
  if (!data) return;

  const grid = document.getElementById('episode-grid');

  data.forEach((ep, i) => {
    const num = i + 1;
    const isReady = ep.sections && ep.sections.length > 0;

    const el = document.createElement(isReady ? 'a' : 'div');
    el.className = 'episode-card ' + (isReady ? 'ready' : 'pending');

    if (isReady) {
      el.href = 'sundarakanda-start.html#' + encodeURIComponent(ep.id);
    }

    el.innerHTML = '<div class="episode-top">' +
      '<span class="episode-num">' + esc(roman[num]) + '</span>' +
      '<h2 class="episode-title">' + esc(ep.title) + '</h2>' +
      '<span class="episode-badge ' + (isReady ? 'badge-ready' : 'badge-pending') + '">' + (isReady ? 'Готов' : 'В работе') + '</span>' +
      '</div>' +
      '<p class="episode-desc">' + esc(ep.description) + '</p>' +
      (isReady ? '<span class="episode-arrow">Читать →</span>' : '');

    grid.appendChild(el);
  });
}

window.addEventListener('DOMContentLoaded', loadEpisodes);
</script>
</body>
</html>
