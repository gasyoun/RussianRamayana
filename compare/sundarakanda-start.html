<div class="container">
  <a href="index.html" class="nav-back">← Все эпизоды</a>

  <header id="episode-header">
    <h1>Загрузка эпизода...</h1>
  </header>

  <div class="comparison-container" id="comparison-content">
    <!-- Will be populated from JSON -->
  </div>

  <div class="commentary-box" id="commentary-box" style="display: none;">

  </div>

  <footer>
    <p>Больше параллельных текстов доступно в <a href="https://samskrtam.ru/parallel-corpus/index_ramayana.html" target="_blank" rel="noopener noreferrer">основном корпусе →</a></p>
  </footer>

<script src="../js/utils.js"></script>
<script>
async function loadEpisode() {
  try {
    const res = await fetch('../data/comparison-episodes.json');
    const data = await res.json();
    const episodeId = window.location.hash ? decodeURIComponent(window.location.hash.slice(1)) : 'sundarakanda-start';
    const episode = data.find(e => e.id === episodeId);

    if(!episode) return;

    const refUrl = safeUrl(episode.canonical_url || '');
    const corpusUrl = safeUrl(episode.corpus_url || '');
    const refLine = episode.canonical_ref ? `
      <p class="canonical-ref">
        <span class="ref-id">Рамаяна ${esc(episode.canonical_ref)}</span>
        ${episode.recension ? `<span class="recension">${esc(episode.recension)} рецензия</span>` : ''}
        ${refUrl ? `<a href="${refUrl}" target="_blank" rel="noopener noreferrer">санскрит (valmikiramayan.net)</a>` : ''}
        ${corpusUrl ? `<a href="${corpusUrl}" target="_blank" rel="noopener noreferrer">перевод Потаповой</a>` : ''}
      </p>` : '';
    document.getElementById('episode-header').innerHTML = `
      <h1>${esc(episode.title)}</h1>
      <p class="intro">${esc(episode.description)}</p>
      ${refLine}
    `;

    const container = document.getElementById('comparison-content');
    episode.sections.forEach(sec => {
      const div = document.createElement('div');
      div.className = 'comparison-block';
      div.innerHTML = `
        <span class="block-label">${esc(sec.label)}</span>
        <div class="block-text">${esc(sec.content)}</div>
      `;
      container.appendChild(div);
    });

    if(episode.commentary) {
      document.getElementById('commentary-box').style.display = 'block';
      document.getElementById('commentary-text').textContent = episode.commentary;
    }

  } catch (e) {
    console.error('Error loading episode:', e);
    document.getElementById('episode-header').innerHTML = '<p style="color:var(--ink-muted);font-style:italic;text-align:center;padding:24px;">Не удалось загрузить данные. Попробуйте обновить страницу.</p>';
  }
}

window.addEventListener('DOMContentLoaded', loadEpisode);
</script>
