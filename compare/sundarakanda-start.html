<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сравнительное чтение · Русская Рамаяна</title>
<link rel="stylesheet" href="../style.css">
<style>
  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 60px 2rem 100px;
    position: relative;
    z-index: 1;
  }

  header {
    text-align: center;
    margin-bottom: 60px;
  }

  h1 {
    font-family: 'Cormorant SC', serif;
    font-size: 28px;
    letter-spacing: 0.1em;
    margin-bottom: 12px;
  }

  .intro {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    font-style: italic;
    color: var(--ink-muted);
    margin-bottom: 40px;
  }

  /* ── COMPARISON TABLE ── */
  .comparison-container {
    display: flex;
    flex-direction: column;
    gap: 32px;
  }

  .comparison-block {
    background: white;
    border: 1px solid var(--border);
    padding: 32px;
  }

  .block-label {
    font-family: 'Cormorant SC', serif;
    font-size: 14px;
    color: var(--gold);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 20px;
    display: block;
    border-bottom: 1px solid var(--border-strong);
    padding-bottom: 8px;
  }

  .block-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    color: var(--ink-soft);
    white-space: pre-wrap;
  }

  .commentary-box {
    margin-top: 40px;
    padding: 32px;
    background: var(--paper-dark);
    border: 1px solid var(--border);
  }

  .commentary-box h3 {
    font-family: 'Cormorant SC', serif;
    font-size: 18px;
    margin-bottom: 16px;
    letter-spacing: 0.05em;
  }

  .commentary-text {
    font-size: 14px;
    color: var(--ink-muted);
    line-height: 1.8;
  }


</style>
</head>
<body>

<div class="container">
  <a href="../index.html" class="nav-back">← Вернуться на главную</a>

  <header id="episode-header">
    <h1>Загрузка эпизода...</h1>
  </header>

  <div class="comparison-container" id="comparison-content">
    <!-- Will be populated from JSON -->
  </div>

  <div class="commentary-box" id="commentary-box" style="display: none;">
    <h3>Комментарий филолога</h3>
    <div class="commentary-text" id="commentary-text"></div>
  </div>

  <footer>
    <p>Больше параллельных текстов доступно в <a href="https://samskrtam.ru/parallel-corpus/index_ramayana.html" target="_blank">основном корпусе →</a></p>
  </footer>
</div>

<script>
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

async function loadEpisode() {
  try {
    const res = await fetch('../data/comparison-episodes.json');
    const data = await res.json();
    const episode = data.find(e => e.id === 'sundarakanda-start');

    if(!episode) return;

    document.getElementById('episode-header').innerHTML = `
      <h1>${esc(episode.title)}</h1>
      <p class="intro">${esc(episode.description)}</p>
    `;

    const container = document.getElementById('comparison-content');
    episode.sections.forEach(sec => {
      const div = document.createElement('div');
      div.className = 'comparison-block';
      div.innerHTML = `
        <span class="block-label">${esc(sec.label)}</span>
        <div class="block-text">${esc(sec.content)}</div>
      `;
      container.appendChild(div);
    });

    if(episode.commentary) {
      document.getElementById('commentary-box').style.display = 'block';
      document.getElementById('commentary-text').textContent = episode.commentary;
    }

  } catch (e) {
    console.error('Error loading episode:', e);
    document.getElementById('episode-header').innerHTML = '<p style="color:var(--ink-muted);font-style:italic;text-align:center;padding:24px;">Не удалось загрузить данные. Попробуйте обновить страницу.</p>';
  }
}

window.addEventListener('DOMContentLoaded', loadEpisode);
</script>

</body>
</html>
