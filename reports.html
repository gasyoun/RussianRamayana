<link rel="stylesheet" href="style.css">
<style>
  .container {
    max-width: 800px;
    margin: 0 auto;
    padding: 60px 2rem 100px;
    position: relative;
    z-index: 1;
  }

  header {
    text-align: center;
    margin-bottom: 60px;
  }

  h1 {
    font-family: 'Cormorant SC', serif;
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 300;
    letter-spacing: 0.05em;
    line-height: 1.1;
    margin-bottom: 16px;
  }

  .subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    font-style: italic;
    color: var(--ink-muted);
  }

  /* ── REPORT CARD ── */
  .report-card {
    background: var(--paper-dark);
    border: 1px solid var(--border);
    padding: 32px;
    margin-bottom: 32px;
  }

  .report-date {
    font-family: 'Cormorant SC', serif;
    font-size: 20px;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
    color: var(--gold);
  }

  .report-summary {
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.6;
    margin-bottom: 20px;
  }

  .report-numbers {
    display: flex;
    gap: 32px;
    margin-bottom: 24px;
    padding: 16px 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }

  .report-number {
    display: flex;
    flex-direction: column;
  }

  .report-number .label {
    font-size: 11px;
    color: var(--ink-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 4px;
  }

  .report-number .value {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    color: var(--ink);
  }

  /* ── SPENDING TABLE ── */
  .spending-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 16px;
    font-size: 13px;
  }

  .spending-table th {
    text-align: left;
    font-family: 'Cormorant SC', serif;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--ink-muted);
    text-transform: uppercase;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-strong);
  }

  .spending-table td {
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    color: var(--ink-soft);
  }

  .spending-table td:last-child {
    text-align: right;
    font-family: 'Cormorant Garamond', serif;
  }

  .report-note {
    font-size: 12px;
    color: var(--ink-muted);
    font-style: italic;
    line-height: 1.5;
    padding-top: 12px;
  }

  footer {
    margin-top: 40px;
    text-align: center;
    font-size: 12px;
    color: var(--ink-muted);
  }

  @media (max-width: 600px) {
    .report-card { padding: 20px; }
    .report-numbers { flex-direction: column; gap: 12px; }
  }
</style>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebPage",
  "name": "Отчёты о сборе средств",
  "description": "Ежемесячные отчёты о поступлениях и расходах проекта Русская Рамаяна. Прозрачность краудфандинга.",
  "url": "https://gasyoun.github.io/RussianRamayana/reports.html"
}
</script>
</head>
<body>
<noscript><div style="max-width:680px;margin:40px auto;padding:2rem;background:var(--paper-dark);border:1px solid var(--border);text-align:center;font-size:14px;color:var(--ink-muted);">Для работы этой страницы требуется JavaScript. Пожалуйста, включите его в настройках браузера.</div></noscript>

<div class="container">
  <a href="index.html" class="nav-back">← Вернуться на главную</a>

  <header>
    <span class="header-ornament">Прозрачность</span>
    <h1>Отчёты о сборе</h1>
    <p class="subtitle">Ежемесячные отчёты о поступлениях и расходах проекта</p>
  </header>

  <div id="reports-list">
    <!-- Populated from data/reports.json -->
  </div>

  <footer>
    <p><a href="support.html" style="color: var(--gold); text-decoration: none; border-bottom: 1px solid var(--border-strong);">Поддержать проект →</a></p>
  </footer>
</div>

<script src="js/utils.js"></script>
<script>
async function loadReports() {
  const data = await loadJSON('data/reports.json', 'reports-list');
  if (!data) return;

  const container = document.getElementById('reports-list');

  data.forEach(report => {
    const card = document.createElement('div');
    card.className = 'report-card';

    let spendingRows = '';
    if (report.spending && report.spending.length) {
      spendingRows = `
        <table class="spending-table">
          <thead><tr><th>Статья</th><th>Сумма</th></tr></thead>
          <tbody>
            ${report.spending.map(s => `
              <tr>
                <td>${esc(s.item)}</td>
                <td>${s.amount_rub > 0 ? s.amount_rub.toLocaleString('ru-RU') + ' ₽' : '—'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    card.innerHTML = `
      <div class="report-date">${esc(report.title)}</div>
      <p class="report-summary">${esc(report.summary)}</p>
      <div class="report-numbers">
        <div class="report-number">
          <span class="label">Собрано</span>
          <span class="value">${report.collected_rub.toLocaleString('ru-RU')} ₽</span>
        </div>
        <div class="report-number">
          <span class="label">Доноров</span>
          <span class="value">${report.donor_count.toLocaleString('ru-RU')}</span>
        </div>
      </div>
      ${spendingRows}
      ${report.note ? `<p class="report-note">${esc(report.note)}</p>` : ''}
    `;

    container.appendChild(card);
  });
}

window.addEventListener('DOMContentLoaded', loadReports);
</script>

</body>
</html>
