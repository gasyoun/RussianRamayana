<style>
  .container {
    max-width: 800px;
    margin: 0 auto;
    padding: 60px 2rem 100px;
    position: relative;
    z-index: 1;
  }

  header {
    text-align: center;
    margin-bottom: 60px;
  }

  h1 {
    font-family: 'Cormorant SC', serif;
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 300;
    letter-spacing: 0.05em;
    margin-bottom: 16px;
  }

  .subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    font-style: italic;
    color: var(--ink-muted);
  }

  /* ── EDITION CARD ── */
  .edition-card {
    background: var(--paper-dark);
    border: 1px solid var(--border);
    padding: 28px 32px;
    margin-bottom: 24px;
  }

  .edition-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .edition-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    color: var(--ink);
  }

  .edition-badge {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 4px 10px;
    border: 1px solid;
    white-space: nowrap;
  }

  .badge-published { color: var(--success); border-color: rgba(74,103,65,0.3); }
  .badge-in-progress { color: var(--gold); border-color: var(--border-strong); }
  .badge-draft-ready { color: var(--gold); border-color: var(--border-strong); }
  .badge-blocked { color: #8a3324; border-color: rgba(138,51,36,0.3); }

  .edition-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    font-size: 13px;
    color: var(--ink-muted);
    margin-bottom: 12px;
  }

  .edition-meta span {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .edition-meta .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .edition-desc {
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.6;
    margin-bottom: 12px;
  }

  .edition-link {
    font-size: 12px;
    color: var(--gold);
    text-decoration: none;
    font-family: 'Cormorant SC', serif;
    letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border-strong);
    transition: color 0.2s;
  }
  .edition-link:hover { color: var(--gold-light); }

  footer {
    margin-top: 60px;
    text-align: center;
    font-size: 12px;
    color: var(--ink-muted);
  }

  @media (max-width: 600px) {
    .edition-card { padding: 20px; }
  }
</style>

<body>
<noscript><div style="max-width:680px;margin:40px auto;padding:2rem;background:var(--paper-dark);border:1px solid var(--border);text-align:center;font-size:14px;color:var(--ink-muted);">Для работы этой страницы требуется JavaScript. Пожалуйста, включите его в настройках браузера.</div></noscript>

<div class="container">
  <a href="index.html" class="nav-back">← Вернуться на главную</a>

  <header>
    <span class="header-ornament">Издания</span>
    <h1>Библиография</h1>
    <p class="subtitle">Русские издания перевода Рамаяны Вальмики в серии «Литературные памятники»</p>
  </header>

  <div id="editions-list">
    <!-- Populated from data/editions.json -->
  </div>

  <footer>
    <p>Библиографические описания подготовлены на основе данных проекта и каталога издательства «Наука».</p>
  </footer>
</div>

<script src="js/utils.js"></script>
<script>
const statusLabels = {
  'published': 'Опубликовано',
  'in-progress': 'В работе',
  'draft-ready': 'Черновик готов',
  'blocked': 'Задерживается'
};

async function loadEditions() {
  const data = await loadJSON('data/editions.json', 'editions-list');
  if (!data) return;

  const container = document.getElementById('editions-list');

  data.forEach(ed => {
    const card = document.createElement('div');
    card.className = 'edition-card';

    const metaParts = [];
    if (ed.year) metaParts.push('<span><span class="label">Год:</span> ' + esc(String(ed.year)) + '</span>');
    if (ed.translator) metaParts.push('<span><span class="label">Перевод:</span> ' + esc(ed.translator) + '</span>');
    if (ed.publisher) metaParts.push('<span><span class="label">Издательство:</span> ' + esc(ed.publisher) + '</span>');
    if (ed.books) metaParts.push('<span><span class="label">Книги:</span> ' + esc(ed.books) + '</span>');

    const linkHTML = ed.url ? '<a class="edition-link" href="' + safeUrl(ed.url) + '" target="_blank" rel="noopener noreferrer">Читать онлайн →</a>' : '';

    card.innerHTML = '<div class="edition-header">' +
      '<h2 class="edition-title">' + esc(ed.title) + '</h2>' +
      '<span class="edition-badge badge-' + esc(ed.status) + '">' + esc(statusLabels[ed.status] || ed.status) + '</span>' +
      '</div>' +
      '<div class="edition-meta">' + metaParts.join('') + '</div>' +
      '<p class="edition-desc">' + esc(ed.description) + '</p>' +
      linkHTML;

    container.appendChild(card);
  });
}

window.addEventListener('DOMContentLoaded', loadEditions);
</script>
</body>
</html>
