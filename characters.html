<script>
const SVGNS = 'http://www.w3.org/2000/svg';
// Фиксированные позиции ключевых фигур для диаграммы связей (остальные — в карточках ниже)
const POS = {
  dasharatha:[130,60], bharata:[70,150], rama:[190,250], lakshmana:[80,320],
  sita:[380,210], jatayu:[380,360],
  hanuman:[300,470], sugriva:[450,485], valin:[575,455],
  ravana:[600,250], vibhishana:[560,95], kumbhakarna:[695,140], indrajit:[700,330]
};
const GROUP_COLOR = { royal:'#b8913a', vanara:'#4A6741', rakshasa:'#b0492f', other:'#7a7a7a' };
const REL_CLASS = { 'father-of':'fam','mother-of':'fam','married-to':'fam','brother-of':'fam','ally-of':'ally','enemy-of':'enemy' };
const REL_COLOR = { fam:'#9c8a5f', ally:'#4A6741', enemy:'#b0492f' };

function el(tag, attrs) { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }

async function load() {
  const data = await loadJSON('data/characters.json', 'cards');
  if (!data) return;
  const byId = Object.fromEntries(data.characters.map(c => [c.id, c]));
  const svg = document.getElementById('graph');
  svg.innerHTML = '';

  // Рёбра
  data.relations.forEach(r => {
    const a = POS[r.from], b = POS[r.to];
    if (!a || !b) return;
    const cls = REL_CLASS[r.type];
    const line = el('line', { x1:a[0], y1:a[1], x2:b[0], y2:b[1], stroke:REL_COLOR[cls], 'stroke-width':1.6, opacity:0.7 });
    if (cls === 'enemy') line.setAttribute('stroke-dasharray', '5,4');
    svg.appendChild(line);
  });
  // Узлы
  Object.entries(POS).forEach(([id, p]) => {
    const c = byId[id]; if (!c) return;
    svg.appendChild(el('circle', { cx:p[0], cy:p[1], r:7, fill:GROUP_COLOR[c.group], stroke:'#fff', 'stroke-width':1.5 }));
    const t = el('text', { x:p[0], y:p[1]-12, 'text-anchor':'middle', 'font-family':"'Cormorant Garamond', serif", 'font-size':14, fill:'#2b2622' });
    t.textContent = c.name_ru;
    svg.appendChild(t);
  });

  // Карточки по группам
  const groups = [
    { key:'royal', title:'Айодхья и Митхила' },
    { key:'vanara', title:'Ванары (обезьянье царство)' },
    { key:'rakshasa', title:'Ракшасы Ланки' },
    { key:'other', title:'Прочие' }
  ];
  const wrap = document.getElementById('cards');
  wrap.innerHTML = '';
  groups.forEach(g => {
    const members = data.characters.filter(c => c.group === g.key);
    if (!members.length) return;
    const h = document.createElement('h2'); h.className = 'grp-title'; h.textContent = g.title; wrap.appendChild(h);
    const grid = document.createElement('div'); grid.className = 'char-grid';
    members.forEach(c => {
      const card = document.createElement('div');
      card.className = 'char-card'; card.style.setProperty('--c', GROUP_COLOR[g.key]);
      const wd = /^Q\d+$/.test(c.wikidata || '') ? c.wikidata : '';
      card.innerHTML =
        '<div class="char-name">' + esc(c.name_ru) + '</div>' +
        '<div class="char-skt"><span class="iast" lang="sa-Latn">' + esc(c.iast) + '</span><span class="deva" lang="sa">' + esc(c.devanagari) + '</span></div>' +
        '<p class="char-role">' + esc(c.role) + '</p>' +
        (wd ? '<a class="char-wd" href="https://www.wikidata.org/wiki/' + wd + '" target="_blank" rel="noopener noreferrer">Викиданные</a>' : '');
      grid.appendChild(card);
    });
    wrap.appendChild(grid);
  });
}
window.addEventListener('DOMContentLoaded', load);
</script>
